# Tiny Tapeout project information
project:
  title:        "LIF Spiking Pattern Generator"      # Project title
  author:       "Justice Rebrovich"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Four leaky integrate-and-fire neurons in a ring that produce spike patterns, with a built-in self-test"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_justice_lif"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_justice_lif.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "I0 (neuron 0 input current bit 0)"
  ui[1]: "I1"
  ui[2]: "I2"
  ui[3]: "I3"
  ui[4]: "I4"
  ui[5]: "I5"
  ui[6]: "I6"
  ui[7]: "I7 (neuron 0 input current bit 7)"

  # Outputs
  uo[0]: "SPIKE0 (neuron 0 spike), or BIST DONE in self-test"
  uo[1]: "V1 (neuron 0 membrane voltage bit 1), or BIST PASS in self-test"
  uo[2]: "V2, or signature bit in self-test"
  uo[3]: "V3, or signature bit in self-test"
  uo[4]: "V4, or signature bit in self-test"
  uo[5]: "V5, or signature bit in self-test"
  uo[6]: "V6, or signature bit in self-test"
  uo[7]: "V7 (neuron 0 membrane voltage MSB), or signature bit in self-test"

  # Bidirectional pins
  uio[0]: "W0 (input: ring weight select bit 0)"
  uio[1]: "W1 (input: ring weight select bit 1)"
  uio[2]: "MODE (input: 0 = refractory 4, 1 = refractory 3)"
  uio[3]: "BIST (input: 1 = run the built-in self-test)"
  uio[4]: "PAGE (input: with BIST = 1, show the signature high byte on uo; with BIST = 0, uo reads 0)"
  uio[5]: "SPIKE1 (output: neuron 1 spike)"
  uio[6]: "SPIKE2 (output: neuron 2 spike)"
  uio[7]: "SPIKE3 (output: neuron 3 spike)"

# Do not change!
yaml_version: 6
